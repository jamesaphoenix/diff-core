[package]
name = "diffcore-tauri"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["desktop"]
desktop = [
  "dep:tauri",
  "dep:tauri-plugin-shell",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-process",
]
web = ["tower-http/fs"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[[bin]]
name = "diffcore-tauri"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "diffcore-web"
path = "src/bin/web.rs"
required-features = ["web"]

[dependencies]
diffcore-core = { path = "../diffcore-core", features = ["logging"] }
tauri = { version = "2", features = [], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
git2 = { workspace = true }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
log = { workspace = true }
tracing = { workspace = true }
axum = "0.7"
async-stream = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
futures-core = "0.3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
