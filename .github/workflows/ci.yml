name: CI

on:
  pull_request:
  push:
    tags-ignore:
      - "v*"
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/diffcore-tauri/ui/package-lock.json

      - name: Install UI dependencies
        working-directory: crates/diffcore-tauri/ui
        run: npm ci

      - name: Build UI
        working-directory: crates/diffcore-tauri/ui
        run: npm run build

      # CI runs on ubuntu, where npm's prebuilt browsers work. The nix devshell
      # instead supplies pkgs.playwright-driver.browsers, because the npm builds
      # are unpatched and will not launch on NixOS. Both paths need the browser
      # revision to match the pinned @playwright/test version.
      - name: Install Playwright browser
        working-directory: crates/diffcore-tauri/ui
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: crates/diffcore-tauri/ui
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: crates/diffcore-tauri/ui/playwright-report/
          retention-days: 7

      - name: Run Rust test suite
        run: cargo test --workspace --locked
